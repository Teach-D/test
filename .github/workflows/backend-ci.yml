name: Backend CI

# 트리거 조건: main 브랜치 push/PR이고 백엔드 파일이 변경된 경우에만 실행
on:
  push:
    branches: [main]
    paths:
      - "apps/backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  ci:
    name: 빌드 · 테스트 · 린트
    runs-on: ubuntu-latest

    defaults:
      run:
        # gradlew가 apps/backend/ 안에 있으므로 working-directory 고정
        working-directory: apps/backend

    steps:
      # 1. 소스 체크아웃
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Java 17 (Eclipse Temurin) 설치
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      # 3. Gradle 캐시 설정
      #    ~/.gradle/caches, ~/.gradle/wrapper 를 캐싱하여 의존성 다운로드 시간 단축
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          # build.gradle.kts 또는 래퍼 설정이 바뀌면 캐시 무효화
          key: gradle-${{ runner.os }}-${{ hashFiles('apps/backend/**/*.gradle.kts', 'apps/backend/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # 4. gradlew 실행 권한 부여 (Linux에서 필수)
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 5. 빌드 (테스트 제외) — 컴파일 에러 조기 탐지
      - name: Build
        run: ./gradlew assemble --no-daemon

      # 6. 테스트 (JUnit 5 + MockK)
      #    dev 프로파일 사용 → H2 in-memory DB로 실행
      - name: Test
        run: ./gradlew test --no-daemon
        env:
          SPRING_PROFILES_ACTIVE: dev

      # 7. 테스트 결과 리포트 업로드 (실패 시에도 확인 가능하도록)
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: apps/backend/build/reports/tests/test/
          retention-days: 7

      # 8. ktlint 스타일 체크
      - name: ktlint check
        run: ./gradlew ktlintCheck --no-daemon
